# ---------- 抓取设置 ----------
fetcher:
  use_fulltext: false  # 不抓全文，直接用摘要分析
  use_browser: false
  max_articles_per_journal: 100   # 每个期刊最多抓取文章数
  date_filter_days: 3 
  request_timeout: 15            # 请求超时秒数
  retry_times: 3                 # 失败重试次数
  delay_between_requests: 2      # 请求间隔秒数（避免频繁访问）

# ---------- 输出与邮件推送设置 ----------
output:
  formats: ["markdown", "html"]
  output_dir: "data/output"
  
  email:
    enabled: false # 如果需要邮件推送，请改为 true 并填写下方信息
    smtp_server: "smtp.163.com"
    smtp_port: 465
    username: "YOUR_EMAIL@163.com"
    password: "YOUR_AUTH_CODE"
    recipients:
      - "TARGET_EMAIL@qq.com"
      
  # 飞书 Webhook 推送（可选）
  feishu:
    enabled: false
    webhook_url: "https://open.feishu.cn/open-apis/bot/v2/hook/YOUR_TOKEN"


# ---------- 调度设置 ----------
scheduler:
  run_time: "08:00"              # 每天运行时间
  timezone: "Asia/Shanghai"

# ---------- 数据库 ----------
database:
  path: "data/db/chem_daily.db"  # SQLite 数据库路径（用于去重）

# ---------- 性能优化 ----------
performance:
  # 并发处理设置
  concurrency: 5                # 全文抓取并发数（建议 3-10）
  llm_concurrency: 3            # LLM 并发调用数（建议 2-5，受 API 限额影响）

  # 速率限制
  rate_limit:
    global_rps: 5               # 全局每秒请求数上限
    domain_limits:              # 针对特定域名的速率（每秒请求数）
      "onlinelibrary.wiley.com": 1   # Wiley 限制严格
      "pubs.acs.org": 2
      "www.nature.com": 2
      "pubs.rsc.org": 2

  # 重试设置
  retry:
    max_attempts: 3              # 每层最大重试次数
    backoff_factor: 1.5          # 指数退避系数（等待 backoff_factor^attempt 秒）
    retry_status_codes: [403, 429, 500, 502, 503, 504]  # 触发重试的状态码

unpaywall_email: "YOUR_EMAIL@163.com" # Unpaywall API 要求提供一个联系邮箱地址，用于监控和联系用户（请替换为你的邮箱）

# ---------- 网页端 ----------
web:
  enable_scheduler: false   # 网页端是否启用每日定时调度（按 scheduler.run_time）
  readonly: false           # 只读模式提示（建议在反向代理层禁用 POST /api/run）
  api_token: ""            # 可选：配置后，POST /api/run 需在请求头带 X-API-Token
