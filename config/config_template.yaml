# ============================================================
# chem-daily 配置模板
# 使用前请将此文件复制到 config/config.yaml 并填入你自己的 API Key
# ============================================================

# ---------- LLM 配置 ----------
llm:
  provider: "deepseek"          # 可选: "deepseek" 或 "qwen"
  
  deepseek:
    api_key: "填入你的_DEEPSEEK_API_KEY"
    base_url: "https://api.deepseek.com"
    model: "deepseek-chat"
    
  qwen:
    api_key: "填入你的_QWEN_API_KEY"
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    model: "qwen-plus"

  temperature: 0.3
  max_tokens: 8192

# ---------- 研究方向过滤 ----------
# 请替换为你自己的研究方向关键词
research_topics:
  - "machine learning interatomic potential"
  - "density functional theory DFT"
  - "molecular dynamics simulation"

# 相关性分数阈值（0-10），低于此分数的文章不推送
relevance_threshold: 4

# ---------- 期刊 RSS 订阅 ----------
