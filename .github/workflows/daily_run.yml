name: Daily Paper Digest Auto Run

on:
  schedule:
    # 每天 UTC 时间 00:00 运行（对应北京时间早上 08:00）
    - cron: '0 0 * * *'
  workflow_dispatch: # 允许手动触发测试

permissions:
  contents: write # 允许机器人提交代码

jobs:
  run-digest:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 拉取代码库 
        uses: actions/checkout@v4

      - name: 2. 配置 Python 3.10 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. 安装依赖包
        run: |
          python -m pip install --upgrade pip
          pip install -r requirement.txt

      - name: 4. 从保险箱恢复配置文件和 Cookie (Python 无损写入模式)
        env:
          CONFIG_YAML: ${{ secrets.CONFIG_YAML }}
          COOKIES_JSON: ${{ secrets.COOKIES_JSON }}
        run: |
          python -c "import os; os.makedirs('config', exist_ok=True); open('config/config.yaml', 'w', encoding='utf-8').write(os.environ.get('CONFIG_YAML', ''))"
          python -c "import os; open('cookies.json', 'w', encoding='utf-8').write(os.environ.get('COOKIES_JSON', ''))"

      - name: 5. 🚀 运行每日文献抓取与解读
        run: python src/main.py

      - name: 6. 将更新后的数据库和报告保存回 GitHub 仓库
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          # 添加所有更新的文件（已被 .gitignore 过滤的敏感文件不会被添加）
          git add .
          # 如果有新数据就提交，没有则跳过
          git commit -m "Auto-update daily papers DB & reports [skip ci]" || echo "今日无新数据更新"
          git push